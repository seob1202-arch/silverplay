<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실버플레이</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A6C56">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <style>
        :root { --primary: #4A6C56; --bg: #F9F9F9; --white: #FFFFFF; --text: #222; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        .container { max-width: 500px; margin: 0 auto; background: var(--white); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        button { cursor: pointer; font-family: inherit; }

        header { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid #EEE; }
        .font-control { background: #F4F6F8; padding: 6px 20px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: #666; }
        .btn-font { border: 1px solid #DDD; background: white; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; }
        .service-banner { background: var(--primary); color: white; padding: 14px 20px; font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .header-title { padding: 20px; text-align: center; }
        .header-title h1 { margin: 0; font-size: 26px; color: var(--primary); }

        .tab-menu { display: flex; border-bottom: 1px solid #EEE; }
        .tab-item { flex: 1; text-align: center; padding: 15px 0; font-size: 17px; font-weight: bold; color: #AAA; border-bottom: 3px solid transparent; cursor: pointer; }
        .tab-item.active { color: var(--text); border-bottom: 3px solid var(--primary); }

        .filter-box { padding: 15px 20px 5px; overflow-x: auto; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none; background: white; }
        .filter-box::-webkit-scrollbar { display: none; }
        .chip { display: inline-block; padding: 8px 16px; margin-right: 6px; border-radius: 20px; background: #F0F0F0; color: #555; font-size: 15px; font-weight: 600; border: none; }
        .chip.active { background: var(--primary); color: white; }

        .section-header { padding: 35px 20px 15px; font-size: 21px; font-weight: 800; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee; background: white; }
        .section-sub { font-size: 14px; color: #666; font-weight: normal; margin-left: auto; }

        .card { background: white; border-bottom: 10px solid #F4F6F8; padding-bottom: 20px; }
        .card.best { border-bottom: 10px solid #FFFAF0; background: #FFFEFA; }
        .card-header { padding: 20px 20px 10px; }
        .card-tag { color: var(--primary); font-weight: 700; font-size: 14px; margin-bottom: 5px; display: block; }
        .card-title { font-size: 22px; font-weight: 700; line-height: 1.35; margin: 0; }

        .info-bar { display: flex; background: #FAFAFA; border: 1px solid #EEE; border-radius: 12px; margin: 0 20px 15px; padding: 12px 0; }
        .info-item { flex: 1; text-align: center; border-right: 1px solid #EEE; }
        .info-item:last-child { border-right: none; }
        .info-lbl { font-size: 12px; color: #888; display: block; margin-bottom: 3px; }
        .info-val { font-size: 14px; font-weight: 700; }

        .video-box { position: relative; width: 100%; padding-bottom: 56.25%; background: black; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .disclaimer { background: #F8F9FA; padding: 12px 20px; font-size: 13px; color: #767676; border-top: 1px solid #EEE; display: flex; gap: 8px; align-items: center; }
        
        .actions { padding: 15px 20px 0; display: flex; gap: 8px; }
        .btn-act { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; border: 1px solid #DDD; background: white; display: flex; align-items: center; justify-content: center; gap: 5px; color:#333; }
        .btn-act:active { background: #eee; transform: scale(0.98); }

        .comment-area { display: none; background: #F8F9FA; margin: 15px 20px 0; padding: 15px; border-radius: 12px; }
        .input-group { display: flex; gap: 8px; }
        .input-box { padding: 10px; border: 1px solid #DDD; border-radius: 8px; flex: 1; }
        .btn-send { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; }
        
        .rec-form { background: #F0F4F2; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .rec-list-item { padding:15px; border-bottom:1px solid #eee; }

        footer { background: #F5F5F5; padding: 40px 20px; margin-top: 40px; color: #888; font-size: 13px; line-height: 1.6; border-top: 1px solid #ddd;}
        .footer-link span { margin-right: 15px; font-weight: bold; cursor: pointer; text-decoration: underline; }

        /* 모달 & 토스트 */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; }
        .modal-box { background: white; width: 85%; max-width: 380px; border-radius: 20px; padding: 25px; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 20px; font-weight: bold; color: var(--primary); margin-bottom: 15px; text-align: center; }
        .btn-cls { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; margin-top: 20px; }
        
        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; align-items: center; pointer-events: none; }
        .toast { background: rgba(30, 30, 30, 0.95); color: white; padding: 14px 24px; border-radius: 50px; font-size: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); opacity: 0; transform: translateY(20px); transition: all 0.3s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* 설치 팝업 */
        #pwa-install { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 12px 24px; border-radius: 50px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 5000; cursor: pointer; align-items: center; gap: 10px; }
        .install-popup-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 6000; align-items: center; justify-content: center; }
        .install-box { background: white; width: 85%; max-width: 350px; border-radius: 20px; padding: 30px 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="font-control">
            <span>글자 크기</span>
            <button class="btn-font" onclick="resizeFont(1)">+</button>
            <button class="btn-font" onclick="resizeFont(-1)">-</button>
        </div>
        <div class="service-banner" onclick="openModal('intro')">
            <span>📢 서비스 이용방법 & 자주 묻는 질문</span>
            <i class="fas fa-chevron-right"></i>
        </div>
        <div class="header-title">
            <h1>실버플레이</h1>
            <p>매일 만나는 건강한 즐거움</p>
        </div>
        <div class="tab-menu">
            <div class="tab-item active" onclick="switchTab('home')">오늘의 영상</div>
            <div class="tab-item" onclick="switchTab('rec')">추천 게시판</div>
        </div>
    </header>

    <div id="view-home">
        <div class="filter-box" id="filters">
            <button class="chip active" onclick="filter('all')">전체</button>
        </div>
        <div id="video-list"></div>
    </div>

    <div id="view-rec" style="display:none; padding:20px;">
        <div class="rec-form">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <h3 style="margin:0;">📢 영상 추천하기</h3>
                <i class="far fa-question-circle" style="font-size:20px; color:#aaa;" onclick="openModal('help_rec')"></i>
            </div>
            <input type="text" id="recWriter" placeholder="작성자 이름" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px;">
            <input type="text" id="recChannel" placeholder="추천 채널/제목" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px;">
            <textarea id="recReason" placeholder="추천 이유" style="width:100%; height:60px; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px;"></textarea>
            <button class="btn-cls" style="margin-top:0;" onclick="submitRec()">등록하기</button>
        </div>
        <h3 style="border-bottom:2px solid #333; padding-bottom:10px;">우리들의 추천 목록</h3>
        <div id="rec-list"></div>
    </div>

    <footer>
        <div class="footer-link" style="margin-bottom:20px;">
            <span onclick="openModal('terms')">이용약관</span>
            <span onclick="openModal('privacy')">개인정보처리방침</span>
        </div>
        <div>
            <strong>상호명:</strong> (주)실버플레이 | <strong>대표자:</strong> 홍길동<br>
            <strong>연락처:</strong> 02-1234-5678 | <strong>사업자:</strong> 123-45-67890<br>
            <strong>주소:</strong> 서울시 강남구 테헤란로 123<br>
            <br>Copyright © SilverPlay. All rights reserved.
        </div>
    </footer>
</div>

<div class="install-popup-bg" id="install-popup">
    <div class="install-box">
        <h2 style="margin:0 0 10px 0; font-size:20px;">앱을 설치해주세요!</h2>
        <p style="color:#666; font-size:15px;">홈 화면에 설치하면<br>매일 편하게 영상을 보실 수 있습니다.</p>
        <button class="btn-cls" style="background:#222;" onclick="triggerInstall()">지금 설치하기</button>
        <button style="background:none; border:none; color:#999; margin-top:15px; text-decoration:underline;" onclick="document.getElementById('install-popup').style.display='none'">나중에 할게요</button>
    </div>
</div>
<div id="pwa-install" onclick="installPWA()"><i class="fas fa-download"></i> 앱으로 설치하기</div>

<div class="modal-bg" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="m-title"></div>
        <div id="m-body" style="font-size:15px; line-height:1.6; color:#555;"></div>
        <button class="btn-cls" onclick="document.getElementById('modal').style.display='none'">닫기</button>
    </div>
</div>
<div id="toast-container" class="toast-container"></div>

<script>
    // ▼▼▼ [GAS URL 입력 필수] ▼▼▼
    const API_URL = 'https://script.google.com/macros/s/AKfycbyEcxr0N-0YgSHGn7bc78StVcdj-oIE7J3uXhCRe-BEhq8YD8zybBuW9y5gIMcPw1lRGQ/exec';
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    let gVideos = [];
    let pwaPrompt;

    document.addEventListener('DOMContentLoaded', loadData);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); pwaPrompt = e;
        setTimeout(() => document.getElementById('install-popup').style.display = 'flex', 2000);
    });

    function triggerInstall() {
        if(pwaPrompt) {
            pwaPrompt.prompt();
            pwaPrompt.userChoice.then((c) => {
                if(c.outcome==='accepted') document.getElementById('install-popup').style.display='none';
                pwaPrompt=null;
            });
        }
    }

    // [핵심 해결] 유튜브 주소 자동 정제 함수 (쇼츠, 모바일, 공백 완벽 대응)
    function extractVideoId(url) {
        if(!url) return '';
        url = url.trim(); // 공백 제거
        
        // 1. 이미 ID만 있는 경우 (11자리)
        if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;

        // 2. Shorts URL 처리
        if(url.includes('shorts/')) {
            const parts = url.split('shorts/');
            return parts[1].split('?')[0]; // ID 뒤에 ?si=... 같은거 제거
        }

        // 3. 일반 URL 처리 (정규식)
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    async function loadData() {
        if(!API_URL || API_URL.includes('URL')) {
            gVideos = [
                {id:1, title:"임영웅 노래모음", videoId:"dQw4w9WgXcQ", category:"트로트", duration:"60분", channelName:"임영웅TV", likes:1000},
                {id:2, title:"무릎 통증 운동", videoId:"xyz", category:"건강", duration:"10분", channelName:"건강박사", likes:500},
                {id:3, title:"스마트폰 교육", videoId:"abc", category:"디지털", duration:"5분", channelName:"친절한금자씨", likes:10}
            ];
            renderFilter(); renderHome(); return;
        }
        try {
            const [v, r] = await Promise.all([
                fetch(`${API_URL}?action=getVideos`).then(res=>res.json()),
                fetch(`${API_URL}?action=getRecommendations`).then(res=>res.json())
            ]);
            gVideos = v;
            renderFilter(); renderHome(); renderRecs(r);
        } catch(e) { console.error(e); showToast('데이터 로드 실패'); }
    }

    function renderFilter() {
        const cats = ['all', ...new Set(gVideos.map(v=>v.category))];
        document.getElementById('filters').innerHTML = cats.map(c => 
            `<button class="chip ${c==='all'?'active':''}" onclick="filter('${c}', this)">${c==='all'?'전체':c}</button>`
        ).join('');
    }

    function filter(cat, btn) {
        if(btn) { document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); btn.classList.add('active'); }
        const div = document.getElementById('video-list');
        div.innerHTML = '';
        if(cat === 'all') renderHome();
        else {
            const list = gVideos.filter(v=>v.category === cat);
            div.innerHTML += `<div class="section-header">${cat} 모음 <span class="section-sub">${list.length}개</span></div>`;
            list.forEach(v => div.appendChild(mkCard(v, false)));
        }
    }

    function renderHome() {
        const div = document.getElementById('video-list');
        div.innerHTML = '';
        const daily = gVideos.slice(0, 5); 
        const popular = [...gVideos].sort((a,b) => b.likes - a.likes).slice(0, 5);

        div.innerHTML += `<div class="section-header">📅 오늘의 엄선작 <span class="section-sub">최신 5개</span></div>`;
        daily.forEach(v => div.appendChild(mkCard(v, false)));

        div.innerHTML += `<div class="section-header" style="border-top:10px solid #f4f6f8; margin-top:10px;"><span style="color:#D4AF37">👑</span> 명예의 전당 <span class="section-sub">인기 영상</span></div>`;
        popular.forEach(v => div.appendChild(mkCard(v, true)));
    }

    function mkCard(v, isBest) {
        // [중요] ID 자동 정제 적용
        const cleanId = extractVideoId(v.videoId);
        
        // ID가 유효하지 않으면 안내 표시
        if(!cleanId) {
            return `<div class="card" style="padding:20px; text-align:center; color:red;">영상 정보를 불러올 수 없습니다. (${v.title})</div>`;
        }

        const el = document.createElement('div');
        el.className = `card ${isBest?'best':''}`;
        el.innerHTML = `
            <div class="card-header">
                <span class="card-tag">${v.category}</span>
                <h2 class="card-title">${isBest?'<span style="color:#D4AF37">👑</span> ':''}${v.title}</h2>
            </div>
            <div class="info-bar">
                <div class="info-item"><span class="info-lbl">시간</span><span class="info-val">${v.duration}</span></div>
                <div class="info-item"><span class="info-lbl">채널</span><span class="info-val">${v.channelName}</span></div>
                <div class="info-item"><span class="info-lbl">추천</span><span class="info-val" id="like-${v.id}">${v.likes}</span></div>
            </div>
            <div class="video-box">
                <iframe src="https://www.youtube.com/embed/${cleanId}?rel=0" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="disclaimer">
                <i class="fas fa-info-circle"></i>
                <span>유튜브 공식 플레이어로 재생되며, 수익은 원작자에게 돌아갑니다.</span>
            </div>
            <div class="actions">
                <button class="btn-act" onclick="handleLike('${v.id}')"><i class="far fa-heart" style="color:red"></i> 좋아요</button>
                <button class="btn-act" onclick="toggleCmt('${v.id}')"><i class="far fa-comment-dots" style="color:var(--primary)"></i> 리뷰</button>
                <button class="btn-act" style="color:#222; border-color:#222;" onclick="shareNative('${v.title}')"><i class="fas fa-share-alt"></i> 공유</button>
            </div>
            <div id="cmt-${v.id}" class="comment-area">
                <div class="input-group">
                    <input type="text" id="txt-${v.id}" class="input-box" placeholder="내용 입력">
                    <button class="btn-send" onclick="submitCmt('${v.id}')">등록</button>
                </div>
            </div>
        `;
        return el;
    }

    function renderRecs(list) {
        document.getElementById('rec-list').innerHTML = list.map(r => 
            `<div class="rec-list-item">
                <div style="font-weight:bold;">📺 ${r.channel}</div>
                <div style="color:#555; margin:5px 0;">${r.reason}</div>
                <div style="font-size:12px; color:#999;">${r.writer}님 추천</div>
            </div>`
        ).join('');
    }

    function handleLike(id) {
        const el = document.getElementById(`like-${id}`);
        el.innerText = parseInt(el.innerText) + 1;
        showToast('❤️ 좋아요를 반영했습니다!');
        if(API_URL && !API_URL.includes('URL')) fetch(API_URL, { method:'POST', body:JSON.stringify({action:'addLike', id:id}) });
    }

    function shareNative(title) {
        if(navigator.share) navigator.share({title:'실버플레이', text:title, url:location.href});
        else { navigator.clipboard.writeText(location.href); showToast("📋 링크가 복사되었습니다!"); }
    }

    function submitCmt(id) {
        const t = document.getElementById(`txt-${id}`).value;
        if(!t) return showToast('내용을 입력해주세요.');
        showToast('📝 리뷰가 등록되었습니다.');
        document.getElementById(`cmt-${id}`).style.display='none';
        if(API_URL && !API_URL.includes('URL')) fetch(API_URL, { method:'POST', body:JSON.stringify({action:'addComment', videoId:id, nickname:'익명', content:t}) });
    }

    function submitRec() {
        const w=document.getElementById('recWriter').value, c=document.getElementById('recChannel').value;
        if(!w || !c) return showToast('이름과 채널명을 입력해주세요.');
        showToast('📢 추천글이 등록되었습니다!');
        document.getElementById('recWriter').value='';
        document.getElementById('recChannel').value='';
        document.getElementById('recReason').value='';
        if(API_URL && !API_URL.includes('URL')) fetch(API_URL, { method:'POST', body:JSON.stringify({action:'addRecommendation', writer:w, channel:c, reason:''}) });
    }

    function toggleCmt(id) { const e = document.getElementById(`cmt-${id}`); e.style.display = e.style.display==='block'?'none':'block'; }
    function switchTab(t) {
        document.getElementById('view-home').style.display = t==='home'?'block':'none';
        document.getElementById('view-rec').style.display = t==='rec'?'block':'none';
        window.scrollTo(0,0);
        document.querySelectorAll('.tab-item').forEach(e => e.classList.toggle('active', e.onclick.toString().includes(t)));
    }
    
    function showToast(msg) {
        const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        requestAnimationFrame(()=>t.classList.add('show'));
        setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2000);
    }

    function openModal(t) {
        const m = document.getElementById('modal'), tit = document.getElementById('m-title'), bod = document.getElementById('m-body');
        m.style.display = 'flex';
        if(t==='intro') { tit.innerText='서비스 안내'; bod.innerHTML='어르신들을 위한 영상 큐레이션 서비스입니다.<br>매일 5개의 새로운 영상이 업데이트됩니다.'; }
        if(t==='terms') { tit.innerText='이용약관'; bod.innerHTML='본 서비스는 유튜브 링크를 제공하며, 수익은 원작자에게 귀속됩니다.'; }
        if(t==='privacy') { tit.innerText='개인정보처리방침'; bod.innerHTML='별도의 회원가입 없이 이용 가능하며, 개인정보를 수집하지 않습니다.'; }
        if(t==='help_rec') { tit.innerText='추천 게시판'; bod.innerHTML='자유롭게 추천해주세요.'; }
    }

    let zoom = 100;
    function resizeFont(d) {
        zoom += d*10;
        if(zoom < 90) zoom = 90; if(zoom > 140) zoom = 140;
        document.body.style.fontSize = zoom + '%';
    }
</script>
