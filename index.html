<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>실버플레이</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a2e23">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --forest:    #2d4f3c;
            --forest-md: #3d6b52;
            --forest-lt: #4e8a6a;
            --gold:      #c8a84b;
            --gold-lt:   #e8cc7a;
            --cream:     #f7f4ee;
            --paper:     #fffdf8;
            --ink:       #1a1a18;
            --ink-md:    #444440;
            --ink-lt:    #888880;
            --border:    #e2ddd4;
            --shadow-sm: 0 2px 12px rgba(30,50,38,.08);
            --shadow-md: 0 6px 28px rgba(30,50,38,.13);
            --shadow-lg: 0 16px 48px rgba(30,50,38,.18);
            --r:         14px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--cream);
            color: var(--ink);
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
            word-break: keep-all;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--cream);
            min-height: 100vh;
        }

        button { cursor: pointer; border: none; font-family: inherit; background: none; }

        /* ── 헤더 ── */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--forest);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 62px;
            box-shadow: 0 3px 18px rgba(0,0,0,.22);
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon {
            width: 34px; height: 34px;
            background: var(--gold);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: var(--forest); flex-shrink: 0;
        }
        .brand h1 {
            font-family: 'Noto Serif KR', serif;
            font-size: 20px; font-weight: 900; color: #fff; letter-spacing: .5px;
        }
        .brand-sub { font-size: 10px; color: rgba(255,255,255,.5); letter-spacing: 1px; margin-top: 1px; }
        .header-controls { display: flex; gap: 8px; }
        .btn-ctrl {
            width: 34px; height: 34px; border-radius: 8px;
            background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
            font-size: 13px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
        }
        .btn-ctrl:hover { background: rgba(255,255,255,.22); }

        /* ── 필터 ── */
        .filter-wrap {
            background: var(--paper);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            overflow-x: auto; white-space: nowrap;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .filter-wrap::-webkit-scrollbar { display: none; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 8px 16px; margin-right: 8px;
            border-radius: 50px; background: var(--cream);
            color: var(--ink-md); font-size: 14px; font-weight: 600;
            border: 1.5px solid var(--border); transition: all .2s; cursor: pointer;
        }
        .chip i { font-size: 11px; }
        .chip.active {
            background: var(--forest); color: #fff; border-color: var(--forest);
            box-shadow: 0 4px 14px rgba(45,79,60,.3);
        }

        /* ── 섹션 헤더 ── */
        .sec-hd {
            padding: 28px 20px 14px;
            display: flex; align-items: flex-end; justify-content: space-between;
        }
        .sec-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.2;
        }
        .sec-count { font-size: 13px; color: var(--ink-lt); font-weight: 500; }

        /* ── 카드 ── */
        .card-list { padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
        .card {
            background: var(--paper);
            border-radius: var(--r);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: box-shadow .25s, transform .25s;
            animation: fadeUp .4s ease both;
        }
        .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(16px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .card.best { border-color: var(--gold); box-shadow: 0 4px 20px rgba(200,168,75,.2); }
        .best-badge {
            display: flex; align-items: center; gap: 6px;
            background: linear-gradient(90deg, var(--gold), var(--gold-lt));
            padding: 6px 14px;
            font-size: 11px; font-weight: 700; color: var(--forest); letter-spacing: 1px;
        }
        .video-wrap {
            position: relative; width: 100%; padding-bottom: 56.25%; background: #0d1f18;
        }
        .video-wrap iframe {
            position: absolute; top:0; left:0; width:100%; height:100%; border: none;
        }
        .card-body { padding: 18px 18px 14px; }
        .card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .badge {
            font-size: 11px; padding: 3px 9px; border-radius: 50px; font-weight: 600;
            background: var(--cream); color: var(--ink-lt); border: 1px solid var(--border);
        }
        .badge.cat { background: rgba(45,79,60,.08); color: var(--forest); border-color: rgba(45,79,60,.15); }
        .badge.dur { background: rgba(200,168,75,.1); color: #9a7a20; border-color: rgba(200,168,75,.2); }
        .card-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 17px; font-weight: 700; line-height: 1.5;
            color: var(--ink); margin-bottom: 14px;
        }
        .card-actions {
            display: flex; gap: 8px;
            border-top: 1px solid var(--border); padding-top: 13px;
        }
        .btn-act {
            flex: 1; padding: 10px 4px; border-radius: 9px;
            font-size: 13px; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            color: var(--ink-lt); background: var(--cream); transition: all .18s;
        }
        .btn-act:hover { background: var(--border); color: var(--ink); }
        .btn-act.primary { color: var(--forest); background: rgba(45,79,60,.07); }
        .btn-act.primary:hover { background: rgba(45,79,60,.14); }

        /* ── 빈 상태 ── */
        .empty-state { padding: 60px 20px; text-align: center; color: var(--ink-lt); }
        .empty-state i { font-size: 38px; display: block; margin-bottom: 14px; opacity: .35; }
        .empty-state p { font-size: 15px; line-height: 1.7; }

        /* ── 추천 게시판 ── */
        .rec-wrap { padding: 0 16px 20px; }
        .form-card {
            background: var(--paper); border-radius: var(--r);
            border: 1px solid var(--border); padding: 22px 20px;
            margin-bottom: 24px; box-shadow: var(--shadow-sm);
        }
        .form-label {
            font-family: 'Noto Serif KR', serif;
            font-size: 17px; font-weight: 700; margin-bottom: 16px; color: var(--ink);
            display: flex; align-items: center; gap: 8px;
        }
        .input-field {
            width: 100%; padding: 13px 15px; margin-bottom: 10px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 15px; font-family: inherit; background: var(--cream);
            color: var(--ink); outline: none; transition: border-color .2s;
        }
        .input-field:focus { border-color: var(--forest-md); }
        .input-field::placeholder { color: var(--ink-lt); }
        .btn-submit {
            width: 100%; padding: 14px; background: var(--forest);
            color: #fff; font-size: 15px; font-weight: 700;
            border-radius: 10px; margin-top: 4px; font-family: inherit;
            transition: background .2s, transform .15s; letter-spacing: .3px;
        }
        .btn-submit:hover { background: var(--forest-md); }
        .btn-submit:active { transform: scale(.98); }
        .rec-item {
            background: var(--paper); padding: 18px;
            border-radius: var(--r); margin-bottom: 12px;
            border: 1px solid var(--border); transition: box-shadow .2s;
        }
        .rec-item:hover { box-shadow: var(--shadow-sm); }
        .rec-ch { font-weight: 700; font-size: 15px; margin-bottom: 5px; color: var(--ink); }
        .rec-reason { color: var(--ink-md); font-size: 14px; line-height: 1.6; margin-bottom: 8px; }
        .rec-who { font-size: 12px; color: var(--ink-lt); text-align: right; }

        /* ── 하단 네비 ── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px;
            background: var(--paper); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            z-index: 1000; box-shadow: 0 -6px 24px rgba(0,0,0,.07);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--ink-lt); width: 80px; cursor: pointer;
            transition: color .2s; padding: 4px 0;
        }
        .nav-item i { font-size: 21px; transition: transform .2s; }
        .nav-item span { font-size: 11px; font-weight: 600; }
        .nav-item.active { color: var(--forest); }
        .nav-item.active i { transform: translateY(-2px); }

        /* ── 로더 ── */
        .loader-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--cream); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .loader-logo {
            width: 56px; height: 56px; background: var(--forest); border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: var(--gold);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(45,79,60,.3); }
            50%      { transform:scale(1.06); box-shadow:0 0 0 12px rgba(45,79,60,0); }
        }
        .loader-txt { font-size: 14px; color: var(--ink-lt); font-weight: 500; }

        /* ── 모달 ── */
        .modal-bg {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,.55); z-index: 2000;
            align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-box {
            background: var(--paper); width: 88%; max-width: 380px;
            border-radius: 20px; padding: 28px 24px 20px;
            max-height: 80vh; overflow-y: auto;
            display: flex; flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .modal-title {
            font-family: 'Noto Serif KR', serif;
            font-size: 18px; font-weight: 700; color: var(--ink);
            margin-bottom: 18px; text-align: center;
        }

        /* ── 토스트 ── */
        .toast {
            position: fixed; bottom: 108px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            background: var(--forest); color: #fff;
            padding: 12px 22px; border-radius: 50px;
            font-size: 14px; font-weight: 600;
            box-shadow: 0 6px 24px rgba(0,0,0,.22);
            opacity: 0; transition: all .3s cubic-bezier(.18,.89,.32,1.28);
            z-index: 9999; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

        /* ── 설치 팝업 (Android) ── */
        .install-pop {
            display: none; position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 420px;
            background: var(--forest); color: #fff;
            border-radius: 20px; z-index: 5000;
            box-shadow: 0 12px 40px rgba(0,0,0,.35); overflow: hidden;
        }
        .install-inner { padding: 18px 20px 14px; display: flex; align-items: center; gap: 14px; }
        .install-icon {
            width: 50px; height: 50px; background: var(--gold); border-radius: 13px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--forest);
        }
        .install-pop-footer { display: flex; border-top: 1px solid rgba(255,255,255,.15); }
        .install-pop-footer button {
            flex:1; padding:13px; font-size:14px; font-weight:700;
            font-family:inherit; color:rgba(255,255,255,.6);
        }
        .install-pop-footer .btn-install-ok {
            background: rgba(255,255,255,.12); color: var(--gold-lt);
            border-left: 1px solid rgba(255,255,255,.15);
        }

        /* ── iOS 팝업 ── */
        .ios-pop {
            display: none; position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 420px;
            background: var(--forest); color: #fff;
            border-radius: 20px; z-index: 5000;
            box-shadow: 0 12px 40px rgba(0,0,0,.35);
            padding: 18px 20px 20px;
        }
        .ios-pop-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .ios-step {
            background: rgba(255,255,255,.1); border-radius: 12px;
            padding: 14px 16px; font-size: 14px; line-height: 2.1;
            color: rgba(255,255,255,.85);
        }
        .ios-step strong {
            background: rgba(255,255,255,.15); padding: 2px 8px;
            border-radius: 6px; color: #fff;
        }

        /* ── 구분선 ── */
        .divider {
            height: 8px; background: var(--cream);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            margin: 4px 0;
        }

        /* ── 푸터 ── */
        .footer {
            padding: 36px 20px 16px; text-align: center;
            color: var(--ink-lt); font-size: 12px; line-height: 2;
        }
        .footer a { color: var(--ink-lt); text-decoration: underline; cursor: pointer; margin: 0 6px; }

        /* ── 스켈레톤 shimmer ── */
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 헤더 -->
    <header>
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-leaf"></i></div>
            <div>
                <h1>실버플레이</h1>
                <div class="brand-sub">Senior Video Curation</div>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn-ctrl" onclick="resizeFont(-1)" title="글자 작게"><i class="fas fa-minus"></i></button>
            <button class="btn-ctrl" onclick="resizeFont(1)"  title="글자 크게"><i class="fas fa-plus"></i></button>
            <button class="btn-ctrl" onclick="openModal('intro')"><i class="fas fa-question"></i></button>
        </div>
    </header>

    <!-- 로더 -->
    <div id="full-loader" class="loader-overlay">
        <div class="loader-logo"><i class="fas fa-leaf"></i></div>
        <div class="loader-txt">영상을 불러오고 있습니다…</div>
    </div>

    <!-- 홈 탭 -->
    <div id="view-home">
        <div class="filter-wrap" id="filters">
            <button class="chip active" data-cat="all"><i class="fas fa-border-all"></i> 전체</button>
        </div>
        <div id="video-list" class="card-list" style="padding-top:8px;"></div>
        <div class="footer">
            <div>
                <a onclick="openModal('terms')">이용약관</a>·
                <a onclick="openModal('privacy')">개인정보처리방침</a>
            </div>
            Copyright © SilverPlay. All rights reserved.
        </div>
    </div>

    <!-- 추천 탭 -->
    <div id="view-rec" style="display:none;">
        <div class="sec-hd" style="padding-bottom:18px;">
            <div>
                <div class="sec-title">📢 추천 게시판</div>
                <div style="font-size:13px;color:var(--ink-lt);margin-top:4px;">이웃들과 좋은 영상을 나눠요</div>
            </div>
        </div>
        <div class="rec-wrap">
            <div class="form-card">
                <div class="form-label"><i class="fas fa-pen" style="font-size:14px;color:var(--forest-lt);"></i> 영상 추천하기</div>
                <input type="text" id="recWriter"  class="input-field" placeholder="작성자 이름">
                <input type="text" id="recChannel" class="input-field" placeholder="추천 채널 또는 영상 제목">
                <input type="text" id="recReason"  class="input-field" placeholder="추천 이유 (간단히)" style="margin-bottom:6px;">
                <button class="btn-submit" onclick="submitRec()">등록하기</button>
            </div>
            <div style="font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;margin-bottom:14px;color:var(--ink);">우리들의 추천 목록</div>
            <div id="rec-list"></div>
        </div>
    </div>

    <!-- 하단 네비 -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <i class="fas fa-tv"></i><span>오늘의 영상</span>
        </div>
        <div class="nav-item" id="nav-rec" onclick="switchTab('rec')">
            <i class="fas fa-comment-medical"></i><span>추천 게시판</span>
        </div>
    </nav>
</div>

<!-- Android 설치 팝업 -->
<div class="install-pop" id="install-popup">
    <div class="install-inner">
        <div class="install-icon"><i class="fas fa-leaf"></i></div>
        <div>
            <div style="font-size:16px;font-weight:800;margin-bottom:4px;">실버플레이 설치</div>
            <div style="font-size:12px;color:rgba(255,255,255,.65);line-height:1.5;">홈 화면에 추가하면 앱처럼<br>빠르고 편리하게 이용할 수 있어요</div>
        </div>
    </div>
    <div class="install-pop-footer">
        <button onclick="dismissInstall()">나중에</button>
        <button class="btn-install-ok" onclick="triggerInstall()">📲 지금 설치</button>
    </div>
</div>

<!-- iOS 설치 팝업 -->
<div class="ios-pop" id="ios-popup">
    <div class="ios-pop-hd">
        <div style="font-size:16px;font-weight:700;">📲 실버플레이 설치 방법</div>
        <button onclick="document.getElementById('ios-popup').style.display='none'"
                style="width:28px;height:28px;background:rgba(255,255,255,.15);border-radius:50%;color:rgba(255,255,255,.7);font-size:14px;display:flex;align-items:center;justify-content:center;">✕</button>
    </div>
    <div class="ios-step">
        <div>① 하단 <strong>공유 ⎙</strong> 버튼을 탭</div>
        <div>② <strong>홈 화면에 추가</strong> 선택</div>
        <div>③ 오른쪽 상단 <strong>추가</strong> 탭</div>
    </div>
</div>

<!-- 모달 -->
<div class="modal-bg" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="m-title"></div>
        <div id="m-body" style="font-size:15px;line-height:1.75;color:var(--ink-md);"></div>
        <button class="btn-submit" style="margin-top:22px;background:var(--forest-md);"
                onclick="document.getElementById('modal').style.display='none'">닫기</button>
    </div>
</div>

<div id="toast-box"></div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyJPup6uP7-3XM-AIELb9YnBhFlgk9OuQhqrvE6RjgPh7d44OMMXUSebMkbnidtB-Yo/exec';

    let gVideos = [];
    let pwaPrompt = null;

    // ── PWA ───────────────────────────────────────
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwaPrompt = e; });
    window.addEventListener('appinstalled', () => {
        hide('install-popup'); hide('ios-popup');
        pwaPrompt = null; toast('🎉 홈 화면에 설치되었습니다!');
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    document.addEventListener('DOMContentLoaded', () => { loadData(); setTimeout(initPWA, 2500); });

    function initPWA() {
        const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
        if (standalone) return;
        const dismissed = localStorage.getItem('pwa_dismissed');
        if (dismissed && Date.now() - +dismissed < 86400000) return;
        const isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        if (isIOS && isSafari) show('ios-popup');
        else if (!isIOS) show('install-popup');
    }

    function triggerInstall() {
        if (pwaPrompt) {
            pwaPrompt.prompt();
            pwaPrompt.userChoice.then(c => {
                hide('install-popup');
                if (c.outcome === 'accepted') toast('🎉 설치가 시작되었습니다!');
                pwaPrompt = null;
            });
        } else {
            hide('install-popup');
            openModal('install_guide');
        }
    }
    function dismissInstall() { hide('install-popup'); localStorage.setItem('pwa_dismissed', Date.now()); }

    // ── 데이터 로딩 ───────────────────────────────
    async function loadData() {
        const loader = document.getElementById('full-loader');
        const cached = localStorage.getItem('silverplay_cache');

        if (cached) {
            const p = JSON.parse(cached);
            gVideos = p.videos || [];
            renderFilter(); renderHome(); renderRecs(p.recommendations);
            if (loader) loader.style.display = 'none';
        } else {
            if (loader) loader.style.display = 'none';
            showSkeleton();
        }

        try {
            const res  = await fetch(`${API_URL}?action=getAllData`);
            const data = await res.json();
            localStorage.setItem('silverplay_cache', JSON.stringify(data));
            gVideos = data.videos || [];
            renderFilter();
            const chip = document.querySelector('.chip.active');
            filter(chip ? chip.dataset.cat : 'all');
            renderRecs(data.recommendations);
        } catch(e) {
            console.error('API Error:', e);
            if (!cached) toast('⚠️ 네트워크 오류. 잠시 후 다시 시도해주세요.');
        }
    }

    function showSkeleton() {
        document.getElementById('video-list').innerHTML = Array(3).fill(`
            <div class="card" style="animation:none;">
                <div style="width:100%;padding-bottom:56.25%;background:linear-gradient(90deg,#e8e3da 25%,#f0ece3 50%,#e8e3da 75%);background-size:200%;animation:shimmer 1.5s infinite;"></div>
                <div class="card-body">
                    <div style="height:13px;border-radius:6px;margin-bottom:10px;width:55%;background:linear-gradient(90deg,#e8e3da 25%,#f0ece3 50%,#e8e3da 75%);background-size:200%;animation:shimmer 1.5s infinite;"></div>
                    <div style="height:17px;border-radius:6px;margin-bottom:7px;background:linear-gradient(90deg,#e8e3da 25%,#f0ece3 50%,#e8e3da 75%);background-size:200%;animation:shimmer 1.5s infinite;"></div>
                    <div style="height:17px;border-radius:6px;width:75%;background:linear-gradient(90deg,#e8e3da 25%,#f0ece3 50%,#e8e3da 75%);background-size:200%;animation:shimmer 1.5s infinite;"></div>
                </div>
            </div>`).join('');
    }

    // ── 필터 ─────────────────────────────────────
    const CAT_ICONS = {
        '전체':'fa-border-all','트로트':'fa-music','건강':'fa-heart-pulse',
        '건강/의학':'fa-stethoscope','요리/살림':'fa-utensils',
        '스마트폰/디지털':'fa-mobile-screen','연금/생활정보':'fa-coins','디지털':'fa-laptop'
    };

    function renderFilter() {
        const cats = ['all', ...new Set(gVideos.map(v => v.category).filter(Boolean))];
        document.getElementById('filters').innerHTML = cats.map(c => {
            const label = c === 'all' ? '전체' : c;
            const icon  = CAT_ICONS[label] || 'fa-play';
            return `<button class="chip ${c==='all'?'active':''}" data-cat="${c}"
                        onclick="filter('${c}',this)">
                        <i class="fas ${icon}"></i> ${label}
                    </button>`;
        }).join('');
    }

    function filter(cat, btn) {
        if (btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            btn.dataset.cat = cat;
        }
        const div = document.getElementById('video-list');
        div.innerHTML = '';
        if (cat === 'all') {
            renderHome();
        } else {
            const list = gVideos.filter(v => v.category === cat);
            div.innerHTML = `<div class="sec-hd"><div class="sec-title">${esc(cat)}</div><div class="sec-count">${list.length}개</div></div>`;
            if (!list.length) {
                div.innerHTML += `<div class="empty-state"><i class="fas fa-film"></i><p>아직 등록된 영상이 없습니다.</p></div>`;
            } else {
                list.forEach((v, i) => div.appendChild(mkCard(v, false, i)));
            }
        }
    }

    function renderHome() {
        const div = document.getElementById('video-list');
        div.innerHTML = '';
        const daily   = gVideos.slice(0, 5);
        const popular = [...gVideos].sort((a,b) => (b.likes||0) - (a.likes||0)).slice(0, 5);

        if (!daily.length) {
            div.innerHTML = `<div class="empty-state"><i class="fas fa-satellite-dish"></i><p>영상을 불러오는 중입니다.<br>잠시만 기다려주세요.</p></div>`;
            return;
        }
        div.innerHTML += `<div class="sec-hd"><div class="sec-title">📅 오늘의 엄선작</div><div class="sec-count">${daily.length}편</div></div>`;
        daily.forEach((v,i) => div.appendChild(mkCard(v, false, i)));
        div.innerHTML += `<div class="divider"></div>`;
        div.innerHTML += `<div class="sec-hd"><div class="sec-title">👑 명예의 전당</div><div class="sec-count">인기순</div></div>`;
        popular.forEach((v,i) => div.appendChild(mkCard(v, true, i)));
    }

    // ── 카드 생성 ─────────────────────────────────
    function extractVideoId(input) {
        if (!input) return null;
        const s = String(input).trim().replace(/[\u200B-\u200D\uFEFF\r\n\t]/g, '');
        if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
        try {
            const url = new URL(s.startsWith('http') ? s : 'https://' + s);
            if (url.hostname === 'youtu.be') { const id = url.pathname.slice(1).split('?')[0]; if (id.length===11) return id; }
            if (url.pathname.includes('/shorts/')) { const id = url.pathname.split('/shorts/')[1].split('?')[0]; if (id.length===11) return id; }
            const v = url.searchParams.get('v'); if (v && v.length===11) return v;
            if (url.pathname.includes('/embed/')) { const id = url.pathname.split('/embed/')[1].split('?')[0]; if (id.length===11) return id; }
        } catch {}
        const m = s.match(/(?:[?&]v=|youtu\.be\/|shorts\/|embed\/)([a-zA-Z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    function mkCard(v, isBest, idx) {
        const vid = extractVideoId(v.videoId);
        const el  = document.createElement('div');
        el.className = `card ${isBest ? 'best' : ''}`;
        el.style.animationDelay = `${idx * 60}ms`;

        if (!vid) {
            el.innerHTML = `<div class="card-body"><p style="color:var(--ink-lt);font-size:13px;padding:8px 0;">⚠️ 영상 로드 실패: ${esc(v.title||'')}</p></div>`;
            return el;
        }

        const cntLen = (v.comments || []).length;
        el.innerHTML = `
            ${isBest ? `<div class="best-badge"><i class="fas fa-crown"></i> BEST</div>` : ''}
            <div class="video-wrap">
                <iframe src="https://www.youtube.com/embed/${vid}?rel=0" allowfullscreen loading="lazy"></iframe>
            </div>
            <div class="card-body">
                <div class="card-meta">
                    <span class="badge cat">${esc(v.category||'')}</span>
                    <span class="badge dur"><i class="far fa-clock" style="font-size:10px;"></i> ${esc(String(v.duration||''))}</span>
                    <span class="badge">${esc(v.channelName||'')}</span>
                </div>
                <h3 class="card-title">${esc(v.title||'')}</h3>
                <div class="card-actions">
                    <button class="btn-act" id="like-btn-${v.id}" onclick="handleLike('${v.id}')">
                        <i class="far fa-heart" style="color:#e05555;font-size:15px;"></i>
                        <span id="like-${v.id}">${v.likes||0}</span>
                    </button>
                    <button class="btn-act primary" onclick="openReviewModal('${v.id}')">
                        <i class="far fa-comment-dots" style="font-size:15px;"></i> 리뷰(${cntLen})
                    </button>
                    <button class="btn-act" onclick="shareNative(${JSON.stringify(v.title||'')}, '${vid}')">
                        <i class="fas fa-share-nodes" style="font-size:14px;"></i> 공유
                    </button>
                </div>
            </div>`;
        return el;
    }

    // ── 리뷰 모달 ─────────────────────────────────
    function openReviewModal(id) {
        const v = gVideos.find(x => String(x.id) === String(id));
        if (!v) return;
        const cmts    = v.comments || [];
        const cmtHtml = cmts.length
            ? `<div style="background:var(--cream);border-radius:10px;margin-bottom:16px;max-height:240px;overflow-y:auto;">
                 ${cmts.map(c => `<div style="padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px;color:var(--ink-md);line-height:1.5;">${esc(c)}</div>`).join('')}
               </div>`
            : `<div style="padding:36px 0;text-align:center;color:var(--ink-lt);font-size:14px;background:var(--cream);border-radius:10px;margin-bottom:16px;">
                 <i class="far fa-comment" style="font-size:28px;display:block;margin-bottom:10px;opacity:.4;"></i>
                 첫 번째 리뷰를 남겨보세요!
               </div>`;

        document.getElementById('m-title').innerText  = `'${v.title}' 리뷰`;
        document.getElementById('m-body').innerHTML   = `
            ${cmtHtml}
            <div style="border-top:1px solid var(--border);padding-top:16px;">
                <input type="text" id="modal-cmt" class="input-field" placeholder="따뜻한 리뷰를 남겨주세요">
                <button class="btn-submit" onclick="submitCmt('${id}')">등록하기</button>
            </div>`;
        show('modal');
    }

    function submitCmt(id) {
        const el  = document.getElementById('modal-cmt');
        const txt = el ? el.value.trim() : '';
        if (!txt) return toast('내용을 입력해주세요.');
        const v = gVideos.find(x => String(x.id) === String(id));
        if (v) { if (!v.comments) v.comments = []; v.comments.push(txt); localStorage.setItem('silverplay_cache', JSON.stringify({videos:gVideos, recommendations:[]})); }
        fetch(API_URL, { method:'POST', body: JSON.stringify({action:'addComment', videoId:id, nickname:'익명', content:txt}) });
        toast('📝 리뷰가 등록되었습니다!');
        openReviewModal(id);
        reRender();
    }

    function reRender() {
        const chip = document.querySelector('.chip.active');
        filter(chip ? chip.dataset.cat : 'all');
    }

    // ── 추천 게시판 ───────────────────────────────
    function renderRecs(list) {
        if (!list) return;
        const div = document.getElementById('rec-list');
        if (!list.length) {
            div.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>아직 추천이 없습니다.<br>첫 번째 추천을 남겨보세요!</p></div>`;
            return;
        }
        div.innerHTML = list.map(r => `
            <div class="rec-item">
                <div class="rec-ch">📺 ${esc(r.channel||'')}</div>
                <div class="rec-reason">${esc(r.reason||'')}</div>
                <div class="rec-who">— ${esc(r.writer||'')}님 추천</div>
            </div>`).join('');
    }

    function submitRec() {
        const w = document.getElementById('recWriter').value.trim();
        const c = document.getElementById('recChannel').value.trim();
        const r = document.getElementById('recReason').value.trim();
        if (!w || !c) return toast('이름과 채널명은 필수입니다.');
        document.getElementById('recWriter').value  = '';
        document.getElementById('recChannel').value = '';
        document.getElementById('recReason').value  = '';
        document.getElementById('rec-list').insertAdjacentHTML('afterbegin',
            `<div class="rec-item">
                <div class="rec-ch">📺 ${esc(c)}</div>
                <div class="rec-reason">${esc(r)}</div>
                <div class="rec-who">— ${esc(w)}님 추천</div>
             </div>`);
        fetch(API_URL, { method:'POST', body: JSON.stringify({action:'addRecommendation', writer:w, channel:c, reason:r}) });
        toast('📢 추천해주셔서 감사합니다!');
    }

    // ── 좋아요 ────────────────────────────────────
    function handleLike(id) {
        const el  = document.getElementById(`like-${id}`);
        const btn = document.getElementById(`like-btn-${id}`);
        if (el) el.innerText = (+el.innerText) + 1;
        if (btn) { const i = btn.querySelector('i'); if (i) { i.classList.replace('far','fas'); i.style.color='#e05555'; } }
        toast('❤️ 좋아요!');
        fetch(API_URL, { method:'POST', body: JSON.stringify({action:'addLike', id}) });
    }

    // ── 공유 ──────────────────────────────────────
    function shareNative(title, vid) {
        const url = `https://youtu.be/${vid}`;
        if (navigator.share) navigator.share({ title:'실버플레이 추천', text:`${title}\n좋은 영상 함께 봐요!`, url });
        else { navigator.clipboard?.writeText(url); toast('📋 영상 주소가 복사되었습니다.'); }
    }

    // ── 탭 전환 ───────────────────────────────────
    function switchTab(t) {
        document.getElementById('view-home').style.display = t==='home' ? 'block' : 'none';
        document.getElementById('view-rec').style.display  = t==='rec'  ? 'block' : 'none';
        window.scrollTo(0, 0);
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`nav-${t}`).classList.add('active');
    }

    // ── 모달 ──────────────────────────────────────
    function openModal(t) {
        const map = {
            intro:        ['서비스 안내', '실버플레이는 시니어분들을 위한<br>맞춤형 영상 큐레이션 서비스입니다.<br><br>매일 엄선된 영상이 업데이트됩니다.'],
            terms:        ['이용약관', '본 서비스는 유튜브의 영상 링크만을 제공하며,<br>모든 영상의 저작권과 수익은<br>원작자(유튜버)에게 귀속됩니다.'],
            privacy:      ['개인정보처리방침', '이 서비스는 회원가입이 없으며,<br>어떠한 개인정보도 서버에 저장하지 않습니다.<br>안심하고 이용하세요.'],
            install_guide:['📲 앱 설치 방법', `크롬 오른쪽 상단 <b>⋮ 메뉴</b> 탭 후<br><br><span style="background:rgba(45,79,60,.1);color:var(--forest);padding:5px 14px;border-radius:8px;font-weight:700;">앱 설치</span> 또는 <span style="background:rgba(45,79,60,.1);color:var(--forest);padding:5px 14px;border-radius:8px;font-weight:700;">홈 화면에 추가</span>`]
        };
        if (!map[t]) return;
        document.getElementById('m-title').innerText = map[t][0];
        document.getElementById('m-body').innerHTML  = map[t][1];
        show('modal');
    }

    // ── 글자 크기 ─────────────────────────────────
    let zoom = 100;
    function resizeFont(d) {
        zoom = Math.min(140, Math.max(90, zoom + d * 10));
        document.body.style.fontSize = zoom + '%';
        toast(`글자 크기: ${zoom}%`);
    }

    // ── 유틸 ──────────────────────────────────────
    function show(id) { const el = document.getElementById(id); if (el) el.style.display = id==='modal' ? 'flex' : 'block'; }
    function hide(id) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }

    function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast'; el.textContent = msg;
        document.getElementById('toast-box').appendChild(el);
        requestAnimationFrame(() => el.classList.add('show'));
        setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 350); }, 2200);
    }

    function esc(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
</script>
</body>
</html>
